name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tcc
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: use_api_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tcc -d use_api_dev"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://tcc:test-only-password@127.0.0.1:5432/use_api_dev
      TEST_DATABASE_URL: postgresql://tcc:test-only-password@127.0.0.1:5432/use_api_test
      SHADOW_DATABASE_URL: postgresql://tcc:test-only-password@127.0.0.1:5432/use_api_shadow
      PGPASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          psql -h 127.0.0.1 -U tcc -d use_api_dev -c 'CREATE DATABASE use_api_test;'
          psql -h 127.0.0.1 -U tcc -d use_api_dev -c 'CREATE DATABASE use_api_shadow;'
      - run: npm exec --workspace use-api -- prisma generate --config prisma7.config.ts
      - run: npm run db:test:setup --workspace use-api
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck --workspace use-api
      - run: npm run typecheck --workspace use-web
      - run: npm run test:architecture
      - run: npm test
      - run: npm run build
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
